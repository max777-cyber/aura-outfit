<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Aura Outfit</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/pedido.css">
    <link rel="stylesheet" href="css/nav-user.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav>
    <a href="/" class="logo">AURA OUTFIT</a>
    <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/carrinho">Carrinho</a></li>
        <li><a href="/perfil">Perfil</a></li>
    </ul>
</nav>

<div class="container">
    <div class="box">

        <div class="icone" id="icone">&#10003;</div>

        <h1 id="titulo">Pedido Criado!</h1>

        <p class="subtitulo" id="subtitulo">
            Seu pedido foi registrado com sucesso.<br>
            Clique abaixo para realizar o pagamento.
        </p>

        <div class="numero-pedido">
            <p class="label">Numero do Pedido</p>
            <p class="valor" id="numeroPedido">---</p>
        </div>

        <div class="info-status" id="infoStatus">
            <div class="dot"></div>
            <span id="statusTexto">Status: <strong>Aguardando Pagamento</strong></span>
        </div>

        <div class="acoes">
            <button id="btnPagar" class="btn-primary" onclick="abrirPagamento(false)">
                Ir para Pagamento
            </button>

            <a href="/" class="btn-ghost">Continuar Comprando</a>

            <a href="/meus-pedidos.html" class="btn-ghost">Ver Meus Pedidos</a>
        </div>

    </div>
</div>

<footer>
    &copy; 2026 Aura Outfit &mdash; Todos os direitos reservados
</footer>

<script>
const API = "";
let pedidoId = null;

async function carregarPedido() {
    const params = new URLSearchParams(window.location.search);
    const statusVolta = params.get("status");
    const statusMP    = params.get("collection_status");

    // 1. URL
    let pid = params.get("pedidoId");

    // 2. sessionStorage
    if (!pid || pid === "null" || pid === "undefined") {
        pid = sessionStorage.getItem("ultimoPedidoId");
    }

    // 3. API — ultimo pedido do usuario logado
    if (!pid || pid === "null" || pid === "undefined") {
        pid = await buscarUltimoPedidoDaApi();
    }

    if (pid && pid !== "null" && pid !== "undefined") {
        pedidoId = pid;
        document.getElementById("numeroPedido").textContent =
            "#" + String(pedidoId).padStart(5, "0");
        sessionStorage.removeItem("ultimoPedidoId");
    }

    const aprovado = statusVolta === "aprovado" || statusMP === "approved";
    const pendente  = statusVolta === "pendente" || statusMP === "pending" || statusMP === "in_process";
    const falhou    = statusVolta === "falhou"   || statusMP === "rejected" || statusMP === "cancelled";

    if (aprovado) {
        await confirmarPagamentoNoBackend(pedidoId);
        atualizarUI("aprovado");
        if (window.history.replaceState) {
            window.history.replaceState({}, document.title, "/pedido.html");
        }
    } else if (falhou) {
        atualizarUI("falhou");
    } else if (pendente) {
        atualizarUI("pendente");
    } else {
        // Recém-criado: tenta abrir o Mercado Pago automaticamente
        atualizarUI("aguardando");
        if (pedidoId) abrirPagamento(true);
    }
}

async function buscarUltimoPedidoDaApi() {
    try {
        const resSessao = await fetch(API + "/api/usuarios/sessao", { credentials: "include" });
        const sessao = await resSessao.json();
        if (!sessao.logado) return null;
        const resPed = await fetch(API + "/api/pedidos/usuario/" + sessao.id, { credentials: "include" });
        if (!resPed.ok) return null;
        const lista = await resPed.json();
        if (lista.length > 0) return lista[lista.length - 1].id;
    } catch {}
    return null;
}

async function abrirPagamento(silencioso) {
    if (!pedidoId) {
        if (!silencioso) alert("Pedido nao encontrado. Volte ao carrinho.");
        return;
    }

    const btn = document.getElementById("btnPagar");
    if (btn) { btn.disabled = true; btn.textContent = "Abrindo pagamento..."; }

    try {
        const res = await fetch(API + "/api/pagamento/criar/" + pedidoId, {
            method: "POST",
            credentials: "include"
        });

        if (!res.ok) {
            const err = await res.json().catch(function() { return {}; });
            throw new Error(err.erro || "Erro " + res.status + " ao criar pagamento");
        }

        const dados = await res.json();
        if (dados.checkoutUrl) {
            window.location.href = dados.checkoutUrl;
            return;
        }
        throw new Error("Link de pagamento nao retornado");
    } catch (e) {
        if (!silencioso) alert(e.message || "Nao foi possivel abrir o pagamento. Tente novamente.");
        if (btn) { btn.disabled = false; btn.textContent = "Ir para Pagamento"; }
    }
}

async function confirmarPagamentoNoBackend(id) {
    try {
        await fetch(API + "/api/pagamento/simular-pagamento/" + id, {
            method: "POST", credentials: "include"
        });
    } catch {}
}

function atualizarUI(estado) {
    const icone    = document.getElementById("icone");
    const titulo   = document.getElementById("titulo");
    const sub      = document.getElementById("subtitulo");
    const statusEl = document.getElementById("statusTexto");
    const infoBox  = document.getElementById("infoStatus");
    const btnPagar = document.getElementById("btnPagar");

    if (estado === "aguardando") {
        icone.textContent = "&#128179;";
        titulo.textContent = "Pedido Criado!";
        sub.innerHTML = "Seu pedido foi registrado com sucesso.<br>Clique abaixo para realizar o pagamento.";
        statusEl.innerHTML = "Status: <strong>Aguardando Pagamento</strong>";
        if (btnPagar) { btnPagar.style.display = "flex"; btnPagar.textContent = "Ir para Pagamento"; }

    } else if (estado === "aprovado") {
        icone.textContent = "✔";
        titulo.textContent = "Pagamento Aprovado!";
        sub.innerHTML = "Tudo certo! Seu pedido foi confirmado.<br>Em breve voce recebera o codigo de rastreio por e-mail.";
        statusEl.innerHTML = "Status: <strong>Pago</strong> — pedido em separacao";
        if (btnPagar) btnPagar.style.display = "none";

    } else if (estado === "falhou") {
        icone.textContent = "✗";
        icone.style.background = "#2e0a0a";
        icone.style.borderColor = "#e74c3c";
        icone.style.color = "#e74c3c";
        titulo.textContent = "Pagamento nao aprovado";
        sub.innerHTML = "Houve um problema com seu pagamento.<br>Tente novamente.";
        infoBox.style.background = "#2e0a0a";
        infoBox.style.borderColor = "#e74c3c";
        infoBox.style.color = "#e74c3c";
        statusEl.innerHTML = "Status: <strong>Cancelado</strong>";
        if (btnPagar) { btnPagar.textContent = "Tentar Novamente"; btnPagar.style.display = "flex"; }

    } else { // pendente
        icone.textContent = "⏳";
        titulo.textContent = "Pagamento Pendente";
        sub.innerHTML = "Seu pagamento esta sendo processado.<br>Se preferir, tente pagar novamente.";
        statusEl.innerHTML = "Status: <strong>Pendente</strong> — em processamento";
        if (btnPagar) { btnPagar.style.display = "flex"; btnPagar.textContent = "Tentar Pagar Novamente"; }
    }
}

carregarPedido();
</script>

<script src="js/nav-user.js"></script>
</body>
</html>
