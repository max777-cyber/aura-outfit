spring.application.name=aura-outfit
server.port=8080
server.forward-headers-strategy=NATIVE

# Producao: configure SPRING_DATASOURCE_* no Railway apontando para o PostgreSQL.
# Desenvolvimento local: usa H2 em memoria como fallback automatico.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aura_outfit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sessao persistida no banco — sobrevive a restarts do Railway
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=24h

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=24h

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aura-outfit-production-a01a.up.railway.app,https://aura-outfit-production.up.railway.app,http://localhost:8080,http://127.0.0.1:8080}
app.frontend.url=${APP_FRONTEND_URL:https://aura-outfit-production-a01a.up.railway.app}

app.admin.email=${APP_ADMIN_EMAIL:adm@aura.local}
app.admin.senha=${APP_ADMIN_SENHA:admin123}
app.admin.nome=${APP_ADMIN_NOME:Administrador}

# Email. Configure por variaveis de ambiente para enviar mensagens de verdade.
# Enquanto SMTP_HOST estiver vazio, os links aparecem no terminal do Spring.
app.email.from=${APP_EMAIL_FROM:no-reply@aura.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

logging.level.com.aura=INFO
logging.level.com.mercadopago=WARN

# Cache do browser para imagens, CSS e JS (1 ano)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Google Login. Crie as credenciais no Google Cloud Console.
# Redirect URI no Google Cloud: https://aura-outfit-production-a01a.up.railway.app/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configure-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}